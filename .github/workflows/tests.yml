name: Tests

on:
  push: {}
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The versions the Puente boilerplate currently pins
          - name: boilerplate versions
            pins: "django==4.2.30 strawberry-graphql==0.327.7 graphql-core==3.2.3 pyjwt==2.15.1"
          # The newest versions allowed by pyproject.toml
          - name: latest allowed
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install . cryptography "pytest>=9.2.0" "pytest-django>=4.14.0" ${{ matrix.pins }}
      - run: pytest

[tool.poetry]
name = "strawberry-django-jwt-lite"
version = "0.1.1"
description = "Stripped-down fork of strawberry-django-jwt: sync JWT auth with long-running refresh tokens for Strawberry + Django"
license = "MIT"
authors = ["Vojtěch Dohnal <vojdoh@gmail.com>"]
maintainers = []
readme = "README.md"
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Web Environment',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Framework :: Django',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Framework :: Django :: 6.0',
]
packages = [
    { include = "strawberry_django_jwt" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4"
Django = ">=4.2,<6.2"
PyJWT = ">=2.0,<3.0"
strawberry-graphql = ">=0.215.1,<1.0"
# For use in local tests and development, in future poetry release replace with dev-dependencies group.
uvicorn = { extras = ["standard"], version = ">=0.54.0", optional = true }

[tool.poetry.group.dev.dependencies]
cryptography = ">=38.0"
django-stubs = { extras = ["compatible-mypy"], version = "^6.1.2", python = ">=3.11" }
flake8 = ">=7.0"
pytest = "^9.2.0"
pytest-django = "^4.14.0"

[tool.poetry.extras]
dev = ["uvicorn"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
DJANGO_SETTINGS_MODULE = "tests.example_app.settings"
# Make the test project importable when the package isn't installed in editable mode (e.g. in CI)
pythonpath = ["."]
python_files = "tests.py test_*.py *_tests.py"
filterwarnings = []

[tool.black]
line-length = 160
target-version = ['py310']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | __pycached__
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
force_sort_within_sections = true

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "strawberry.ext.mypy_plugin",
]
exclude = "^tests/migrations"

[tool.django-stubs]
django_settings_module = "tests.example_app.settings"

[tool.poetry.urls]
"Homepage" = "https://github.com/KundaPanda/strawberry-django-jwt/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
